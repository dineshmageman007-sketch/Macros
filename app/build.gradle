plugins {
    id 'com.android.application'
}

android {
    namespace 'com.macrotracker.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.macrotracker.app'   // internal id - never rename (breaks installs/data)
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Fixed personal key so every CI build is signed the same and installs over the previous one
    // (keeps the app's saved data). Sideload use only - not a Play Store key.
    signingConfigs {
        personal {
            storeFile file('macrotracker.keystore')
            storePassword 'macrotracker'
            keyAlias 'macrotracker'
            keyPassword 'macrotracker'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
    }
    lint { checkReleaseBuilds false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
